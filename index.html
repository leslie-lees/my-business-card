<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="产品经理个人作品集——在风险与体验之间做判断。">
  <meta name="theme-color" content="#14181F">
  <title>产品经理作品集｜在风险与体验之间做判断</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #14181F;
      --surface: #1B2029;
      --surface-2: #202733;
      --navy: #16386B;
      --navy-soft: #3D5B8C;
      --gold: #A9793A;
      --gold-bright: #C8924C;
      --gold-soft: #D9C4A2;
      --cream: #F3EBDE;
      --text: #EEF0F3;
      --text-mute: #909AA8;
      --line: #5A6472;
      --danger: #B4342A;
      --max: 1180px;
      --radius: 6px;
      --header-h: 72px;
      --pad: clamp(1.1rem, 4vw, 3rem);
      --section-gap: clamp(4.5rem, 10vw, 8rem);
      --title: clamp(2.65rem, 8vw, 6.5rem);
      --h2: clamp(1.65rem, 4vw, 3.2rem);
      --h3: clamp(1.05rem, 2vw, 1.35rem);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 80% 0%, rgba(22, 56, 107, .24), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
      font-size: clamp(.96rem, 1.4vw, 1.05rem);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    body.modal-open { overflow: hidden; }
    button, a, summary { -webkit-tap-highlight-color: transparent; }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    img { max-width: 100%; }
    ::selection { color: var(--bg); background: var(--gold-soft); }

    .skip-link {
      position: fixed; z-index: 9999; left: 1rem; top: -5rem;
      padding: .65rem 1rem; background: var(--cream); color: var(--bg);
    }
    .skip-link:focus { top: 1rem; }
    :focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 4px; }

    .shell { width: min(100%, var(--max)); margin-inline: auto; padding-inline: var(--pad); }
    .mono, .eyebrow, .page-no, .brand, .tab-button, .case-index, .chip, .link-kind {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      text-transform: uppercase;
      letter-spacing: .15em;
    }

    .site-header {
      position: sticky; z-index: 100; top: 0; height: var(--header-h);
      border-bottom: 1px solid rgba(90, 100, 114, .55);
      background: rgba(20, 24, 31, .9); backdrop-filter: blur(16px);
    }
    .header-inner { height: 100%; display: flex; align-items: center; gap: 1rem; }
    .brand { color: var(--gold-soft); font-size: .74rem; font-weight: 600; white-space: nowrap; }
    .desktop-tabs { margin-left: auto; display: flex; align-self: stretch; }
    .tab-button {
      position: relative; border: 0; background: transparent; color: var(--text-mute);
      padding: 0 clamp(.65rem, 1.3vw, 1.1rem); cursor: pointer; font-size: .67rem;
    }
    .tab-button::after {
      content: ""; position: absolute; height: 2px; left: 22%; right: 22%; bottom: -1px;
      background: var(--gold); transform: scaleX(0); transition: transform .25s ease;
    }
    .tab-button:hover, .tab-button[aria-selected="true"] { color: var(--text); }
    .tab-button[aria-selected="true"]::after { transform: scaleX(1); }
    .header-actions { display: flex; align-items: center; gap: .55rem; }
    .language-switch, .contact-button, .arrow-button, .case-dot {
      border: 1px solid var(--line); background: transparent; cursor: pointer;
      transition: border-color .2s ease, color .2s ease, background .2s ease, transform .2s ease;
    }
    .language-switch { border-radius: 99px; padding: .38rem .65rem; color: var(--gold-soft); font-size: .78rem; white-space: nowrap; }
    .contact-button { border-color: var(--gold); border-radius: 4px; padding: .45rem .8rem; font-size: .82rem; }
    .language-switch:hover, .contact-button:hover, .arrow-button:hover { border-color: var(--gold-soft); color: var(--gold-soft); }

    main { min-height: calc(100vh - var(--header-h)); overflow: clip; }
    .panel { display: none; min-height: calc(100vh - var(--header-h)); }
    .panel.is-active { display: block; animation: panel-in .48s cubic-bezier(.2,.8,.2,1) both; }
    .panel.from-left { animation-name: panel-in-left; }
    @keyframes panel-in { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
    @keyframes panel-in-left { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }

    .section { position: relative; padding-block: var(--section-gap); border-bottom: 1px solid rgba(90, 100, 114, .32); }
    .section-head { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: start; margin-bottom: clamp(2rem, 5vw, 3.5rem); }
    .eyebrow { color: var(--gold-soft); font-size: .72rem; font-weight: 500; margin: 0 0 .5rem; }
    .section-title { margin: 0; font-size: var(--h2); line-height: 1.17; letter-spacing: -.035em; }
    .page-no { padding-top: .35rem; color: var(--text-mute); font-size: .7rem; white-space: nowrap; }
    .section-intro { max-width: 45rem; color: var(--text-mute); font-size: clamp(1rem, 2vw, 1.16rem); }

    .hero { min-height: calc(100svh - var(--header-h)); display: grid; align-content: center; padding-block: clamp(3.5rem, 8vw, 7rem); }
    .hero-topline { display: flex; justify-content: space-between; gap: 1rem; align-items: start; }
    .hero h1 { margin: 1.25rem 0 .8rem; font-size: var(--title); line-height: .98; letter-spacing: -.055em; font-weight: 650; max-width: 9em; }
    .hero-position { max-width: 39rem; font-size: clamp(1.15rem, 2.5vw, 1.7rem); color: var(--gold-soft); line-height: 1.45; }
    .hero-note { max-width: 48rem; margin: 1.2rem 0 0; color: var(--text-mute); }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 2rem 0 2.5rem; }
    .chip { border: 1px solid var(--navy-soft); background: rgba(22,56,107,.18); padding: .35rem .6rem; color: #B9C9E2; font-size: .64rem; }
    .metrics { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); background: rgba(27,32,41,.72); }
    .metric { min-width: 0; padding: clamp(1rem, 2.2vw, 1.5rem); border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-number { display: block; color: var(--gold-bright); font-size: clamp(1.9rem, 4vw, 3.5rem); font-weight: 700; line-height: 1; letter-spacing: -.04em; }
    .metric-label { display: block; margin-top: .75rem; color: var(--text-mute); font-size: .78rem; line-height: 1.45; }
    .value-strip { margin-top: 1rem; padding: 1.25rem; display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; border-left: 3px solid var(--gold); background: linear-gradient(90deg, rgba(169,121,58,.12), transparent); }
    .value-strip strong { color: var(--gold-soft); }
    .status-pill { justify-self: end; border: 1px solid var(--gold); color: var(--gold-soft); padding: .35rem .65rem; font-size: .75rem; white-space: nowrap; }

    .jump-grid, .pillar-grid, .credential-grid, .link-grid { display: grid; gap: 1rem; grid-template-columns: repeat(3, 1fr); }
    .jump-card, .pillar-card, .credential-card, .link-card, .method-card {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: clamp(1.15rem, 2.5vw, 1.65rem);
    }
    .jump-card { min-height: 13rem; cursor: pointer; text-align: left; color: inherit; position: relative; overflow: hidden; }
    .jump-card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(22,56,107,.28), transparent 55%); opacity: 0; transition: opacity .25s ease; }
    .jump-card:hover { border-color: var(--gold); }
    .jump-card:hover::before { opacity: 1; }
    .jump-card > * { position: relative; }
    .card-no { color: var(--gold-soft); font-size: .68rem; }
    .jump-card h3, .pillar-card h3, .method-card h3, .credential-card h3 { margin: 2.4rem 0 .65rem; font-size: var(--h3); }
    .jump-card p, .pillar-card p, .credential-card p { color: var(--text-mute); margin: 0; font-size: .92rem; }
    .jump-arrow { position: absolute; right: 1.35rem; bottom: 1.1rem; color: var(--gold); font-size: 1.3rem; }

    .pillar-card { min-height: 17rem; }
    .pillar-icon { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border: 1px solid var(--navy-soft); background: var(--navy); color: var(--gold-soft); font-family: "IBM Plex Mono", monospace; }
    .capability-map { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; margin-top: 2rem; }
    .cap-layer { position: relative; min-height: 16rem; padding: 1.35rem; border-top: 3px solid var(--navy-soft); background: var(--surface); }
    .cap-layer:nth-child(1), .cap-layer:nth-child(4) { border-color: var(--gold); }
    .cap-layer h3 { margin: 1.5rem 0 .75rem; }
    .cap-layer ul { padding: 0; margin: 0; list-style: none; color: var(--text-mute); font-size: .86rem; }
    .cap-layer li + li { margin-top: .45rem; }
    .mainline { margin-top: 1rem; border: 1px solid var(--gold); padding: 1.2rem; color: var(--gold-soft); text-align: center; }

    .timeline { position: relative; margin-top: 1rem; }
    .timeline::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--line); }
    .timeline-item { position: relative; width: 50%; padding: 0 3.1rem 3.2rem 0; opacity: .42; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
    .timeline-item:nth-child(even) { margin-left: 50%; padding: 0 0 3.2rem 3.1rem; }
    .timeline-item.is-visible { opacity: 1; transform: none; }
    .timeline-dot { position: absolute; right: -.42rem; top: .35rem; width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid var(--gold); background: var(--bg); }
    .timeline-item:nth-child(even) .timeline-dot { left: -.39rem; }
    .timeline-date { color: var(--gold-soft); font: 500 .72rem/1.5 "IBM Plex Mono", monospace; letter-spacing: .12em; }
    .timeline-card { margin-top: .6rem; padding: 1.1rem; border: 1px solid var(--line); background: var(--surface); }
    .timeline-card h3 { margin: 0 0 .35rem; }
    .timeline-card p { margin: 0; color: var(--text-mute); font-size: .88rem; }
    .placeholder { display: inline-block; margin-top: .65rem; color: var(--danger); font-size: .72rem; font-weight: 600; }

    .project-shell { max-width: 980px; margin-inline: auto; }
    .case-nav { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; margin-bottom: 1rem; }
    .arrow-button { width: 2.8rem; height: 2.8rem; border-radius: 50%; font-size: 1.35rem; }
    .case-position { text-align: center; color: var(--text-mute); font-size: .72rem; }
    .case-stage { position: relative; overflow: hidden; touch-action: pan-y; }
    .case-card { border: 1px solid var(--line); border-top: 3px solid var(--gold); background: var(--surface); padding: clamp(1.15rem, 4vw, 2.6rem); animation: case-in .38s ease both; }
    .case-card.reverse { animation-name: case-in-reverse; }
    @keyframes case-in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
    @keyframes case-in-reverse { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
    .case-index { color: var(--gold-soft); font-size: .72rem; }
    .case-card h2 { margin: .7rem 0 .35rem; font-size: clamp(1.55rem, 4vw, 2.75rem); line-height: 1.2; }
    .case-role { margin: 0 0 2rem; color: var(--text-mute); }
    .case-result { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; margin-bottom: 1.5rem; }
    .result-cell { padding: 1rem; border: 1px solid var(--navy-soft); background: rgba(22,56,107,.17); }
    .result-cell strong { display: block; color: var(--gold-bright); font-size: 1.25rem; }
    .result-cell span { color: var(--text-mute); font-size: .75rem; }
    details { border-top: 1px solid var(--line); }
    details:last-of-type { border-bottom: 1px solid var(--line); }
    summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 0; cursor: pointer; font-weight: 600; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--gold); font-size: 1.25rem; font-weight: 400; }
    details[open] summary::after { content: "−"; }
    .detail-body { color: var(--text-mute); padding: 0 0 1.25rem; }
    .detail-body ul { margin: 0; padding-left: 1.25rem; }
    .tradeoff { display: grid; grid-template-columns: 1fr 1fr 1.35fr; gap: .7rem; }
    .trade-box { padding: 1rem; border: 1px solid var(--line); }
    .trade-box strong { display: block; margin-bottom: .4rem; }
    .trade-take { background: var(--cream); color: var(--bg); border-color: var(--cream); }
    .trade-give strong { color: #E17268; }
    .trade-why { color: var(--text-mute); }
    .case-dots { display: flex; justify-content: center; gap: .5rem; margin-top: 1.2rem; }
    .case-dot { width: .5rem; height: .5rem; border-radius: 50%; padding: 0; background: var(--line); border: 0; }
    .case-dot.is-active { background: var(--gold); transform: scale(1.35); }
    .swipe-hint { text-align: center; color: var(--text-mute); font-size: .72rem; margin-top: .6rem; }

    .workflow { display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; counter-reset: flow; }
    .flow-step { position: relative; min-height: 13rem; padding: 1rem; border: 1px solid var(--line); background: var(--surface); counter-increment: flow; }
    .flow-step::before { content: "0" counter(flow); color: var(--gold); font: 600 1.7rem/1 "IBM Plex Mono", monospace; }
    .flow-step:not(:last-child)::after { content: "→"; position: absolute; z-index: 2; right: -.75rem; top: 50%; color: var(--gold-soft); }
    .flow-step h3 { margin: 2rem 0 .5rem; font-size: 1rem; }
    .flow-step p { margin: 0; color: var(--text-mute); font-size: .8rem; }
    .comparison { margin-top: 1.5rem; padding: 1.3rem; border: 1px solid var(--navy-soft); background: rgba(22,56,107,.13); }
    .bar-row { display: grid; grid-template-columns: minmax(5rem, 8rem) 1fr auto; gap: .8rem; align-items: center; margin-top: .8rem; }
    .bar-track { height: .55rem; background: #303947; overflow: hidden; }
    .bar-fill { height: 100%; width: 0; background: var(--text-mute); transition: width 1s cubic-bezier(.2,.8,.2,1); }
    .bar-fill.ai { background: var(--gold); }
    .comparison.is-visible .bar-fill { width: var(--bar); }
    .bar-value { color: var(--gold-soft); font-family: "IBM Plex Mono", monospace; font-size: .75rem; }
    .framework { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1rem; }
    .north-star { min-height: 21rem; display: grid; place-items: center; text-align: center; padding: 2rem; border: 1px solid var(--gold); background: radial-gradient(circle, rgba(169,121,58,.2), transparent 62%), var(--surface); }
    .north-star strong { display: block; color: var(--gold-bright); font-size: clamp(1.8rem, 4vw, 3rem); }
    .north-star p { max-width: 25rem; color: var(--text-mute); }
    .guardrails { display: grid; gap: .7rem; }
    .guardrail { display: grid; grid-template-columns: auto 1fr; gap: .85rem; align-items: start; padding: 1rem; border: 1px solid var(--line); background: var(--surface); }
    .guardrail-mark { width: .55rem; height: .55rem; margin-top: .52rem; background: var(--danger); }
    .guardrail strong { display: block; }
    .guardrail span { color: var(--text-mute); font-size: .82rem; }
    .difference { margin-top: 1rem; padding: clamp(1.4rem, 4vw, 2.4rem); border-left: 4px solid var(--gold); background: linear-gradient(110deg, rgba(169,121,58,.12), rgba(22,56,107,.14)); }
    .difference blockquote { margin: .6rem 0 0; max-width: 48rem; font-size: clamp(1.25rem, 3vw, 2rem); line-height: 1.45; }

    .credential-card { min-height: 14rem; }
    .credential-card.is-placeholder { border-style: dashed; }
    .credential-card .stamp { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border: 1px solid var(--gold); color: var(--gold); transform: rotate(-4deg); }
    .link-grid { margin-top: 1.5rem; }
    .link-card { position: relative; text-decoration: none; min-height: 10rem; transition: border-color .2s ease, transform .2s ease; }
    .link-card:hover { border-color: var(--gold); transform: translateY(-3px); }
    .link-kind { color: var(--gold-soft); font-size: .65rem; }
    .link-card h3 { margin: 1.7rem 0 .35rem; }
    .link-card p { margin: 0; color: var(--text-mute); font-size: .82rem; }
    .link-card .jump-arrow { top: 1rem; bottom: auto; }

    .footer { padding: clamp(3.5rem, 8vw, 6rem) 0 calc(2rem + env(safe-area-inset-bottom)); background: #11151B; }
    .footer-cta { display: grid; grid-template-columns: 1fr auto; gap: 2rem; align-items: end; }
    .footer h2 { margin: .55rem 0 0; max-width: 17em; font-size: clamp(1.8rem, 5vw, 4rem); line-height: 1.16; }
    .footer-meta { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 1rem; color: var(--text-mute); font-size: .72rem; }

    .modal { position: fixed; z-index: 1000; inset: 0; display: none; place-items: center; padding: 1rem; background: rgba(7,9,12,.78); backdrop-filter: blur(8px); }
    .modal.is-open { display: grid; }
    .modal-card { width: min(100%, 520px); border: 1px solid var(--gold); background: var(--surface); padding: clamp(1.3rem, 4vw, 2rem); }
    .modal-head { display: flex; justify-content: space-between; align-items: start; }
    .modal h2 { margin: .4rem 0 0; }
    .close-button { border: 0; background: transparent; color: var(--text-mute); cursor: pointer; font-size: 1.7rem; line-height: 1; }
    .contact-list { display: grid; gap: .65rem; margin-top: 1.5rem; }
    .contact-item { display: grid; grid-template-columns: 4rem 1fr auto; align-items: center; gap: .8rem; padding: .85rem; border: 1px solid var(--line); text-decoration: none; }
    .contact-item:hover { border-color: var(--gold); }
    .contact-label { color: var(--text-mute); font-size: .75rem; }
    .contact-value { overflow-wrap: anywhere; }
    .copy-button { border: 0; background: transparent; color: var(--gold-soft); cursor: pointer; font-size: .75rem; }
    .contact-note { color: var(--danger); font-size: .72rem; margin: 1rem 0 0; }

    .mobile-tabs { display: none; }
    .mobile-only { display: none; }

    @media (max-width: 768px) {
      :root { --header-h: 62px; }
      body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
      .site-header .desktop-tabs { display: none; }
      .brand { max-width: 9rem; overflow: hidden; text-overflow: ellipsis; }
      .header-inner { justify-content: space-between; }
      .header-actions { margin-left: auto; }
      .contact-button { padding: .42rem .6rem; }
      .mobile-tabs {
        position: fixed; z-index: 100; left: 0; right: 0; bottom: 0;
        display: grid; grid-template-columns: repeat(5, 1fr);
        padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--line);
        background: rgba(20,24,31,.96); backdrop-filter: blur(16px);
      }
      .mobile-tabs .tab-button { height: 64px; padding: .35rem .15rem; font-size: .55rem; letter-spacing: .06em; line-height: 1.2; }
      .mobile-tabs .tab-button::before { content: attr(data-index); display: block; margin-bottom: .3rem; color: var(--gold-soft); font-size: .58rem; }
      .mobile-tabs .tab-button::after { left: 28%; right: 28%; bottom: auto; top: -1px; }
      .hero { min-height: auto; }
      .hero-topline .page-no { display: none; }
      .hero h1 { max-width: 7em; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .metric { border-bottom: 1px solid var(--line); }
      .metric:nth-child(2n) { border-right: 0; }
      .metric:last-child { grid-column: 1 / -1; border-bottom: 0; }
      .value-strip { grid-template-columns: 1fr; }
      .status-pill { justify-self: start; }
      .jump-grid, .pillar-grid, .credential-grid, .link-grid, .framework { grid-template-columns: 1fr; }
      .jump-card { min-height: 10.5rem; }
      .pillar-card { min-height: auto; }
      .capability-map { grid-template-columns: 1fr 1fr; }
      .cap-layer { min-height: 13rem; }
      .timeline::before { left: .35rem; }
      .timeline-item, .timeline-item:nth-child(even) { width: 100%; margin-left: 0; padding: 0 0 2.4rem 2rem; }
      .timeline-dot, .timeline-item:nth-child(even) .timeline-dot { left: 0; right: auto; }
      .case-result { grid-template-columns: 1fr; }
      .tradeoff { grid-template-columns: 1fr; }
      .workflow { grid-template-columns: 1fr; }
      .flow-step { min-height: auto; }
      .flow-step:not(:last-child)::after { content: "↓"; right: 1rem; top: auto; bottom: -.95rem; }
      .bar-row { grid-template-columns: 5rem 1fr; }
      .bar-value { grid-column: 2; }
      .footer-cta { grid-template-columns: 1fr; align-items: start; }
      .footer-meta { flex-direction: column; }
      .contact-item { grid-template-columns: 3.4rem 1fr; }
      .contact-item .copy-button { grid-column: 2; justify-self: start; }
      .desktop-only { display: none; }
      .mobile-only { display: inline; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .timeline-item { opacity: 1; transform: none; }

      $("#mobileTabs").innerHTML = content.tabs.map((tab, index) => tabMarkup(tab, index, true)).join("");
      $$(".tab-button[data-tab]").forEach(button => {
        button.addEventListener("click", () => switchTab(Number(button.dataset.tab)));

    function switchTab(nextIndex, focusTab = false) {
      if (nextIndex === activeTab || nextIndex < 0 || nextIndex >= content.tabs.length) return;
      const previous = activeTab; activeTab = nextIndex;
      const panels = $$(".panel");
      panels.forEach((panel, index) => {
        const active = index === activeTab;
        panel.hidden = !active; panel.classList.toggle("is-active", active);
        panel.classList.toggle("from-left", active && activeTab < previous);
      });
      $$(".tab-button[data-tab]").forEach(button => {
        const selected = Number(button.dataset.tab) === activeTab;
        button.setAttribute("aria-selected", selected); button.tabIndex = selected ? 0 : -1;
      });
      if (focusTab) $(`#d-tab-${content.tabs[activeTab].id}`)?.focus();
      window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
      if (activeTab === 0) observeMotion();
    }

    function handleTabKeys(event) {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      let next = activeTab;
      if (event.key === "ArrowLeft") next = (activeTab - 1 + content.tabs.length) % content.tabs.length;
      if (event.key === "ArrowRight") next = (activeTab + 1) % content.tabs.length;
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = content.tabs.length - 1;
      switchTab(next, true);
    }

    function changeCase(next, direction = 1) {
      const total = content.projects.cases.length;
      activeCase = (next + total) % total; caseDirection = direction;
      const stage = $("#caseStage"); if (!stage) return;
      stage.innerHTML = renderCase();
      $(".case-position").textContent = `‹ ${t(content.projects.caseOf)} ${activeCase + 1} / ${total} ›`;
      $$(".case-dot").forEach((dot, index) => { dot.classList.toggle("is-active", index === activeCase); dot.setAttribute("aria-current", index === activeCase); });
    }

    function bindDynamicEvents() {
      $$("[data-jump]").forEach(button => button.addEventListener("click", () => switchTab(content.tabs.findIndex(tab => tab.id === button.dataset.jump))));
      $("#prevCase")?.addEventListener("click", () => changeCase(activeCase - 1, -1));
      $("#nextCase")?.addEventListener("click", () => changeCase(activeCase + 1, 1));
      $$("[data-case]").forEach(dot => dot.addEventListener("click", () => { const next = Number(dot.dataset.case); changeCase(next, next >= activeCase ? 1 : -1); }));
      let startX = 0, startY = 0;
      $("#caseStage")?.addEventListener("touchstart", event => { startX = event.changedTouches[0].clientX; startY = event.changedTouches[0].clientY; }, { passive: true });
      $("#caseStage")?.addEventListener("touchend", event => { const dx = event.changedTouches[0].clientX - startX, dy = event.changedTouches[0].clientY - startY; if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) changeCase(activeCase + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1); }, { passive: true });
      $$("[data-placeholder-link]").forEach(link => link.addEventListener("click", event => event.preventDefault()));
    }

    function observeMotion() {
      if (reducedMotion || !("IntersectionObserver" in window)) {
        $$("[data-count]").forEach(el => el.textContent = el.dataset.count + t(content.home.metrics[$$("[data-count]").indexOf(el)]?.suffix));
        $$(".timeline-item, .comparison").forEach(el => el.classList.add("is-visible")); return;
      }
      const countObserver = new IntersectionObserver(entries => entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const el = entry.target, target = Number(el.dataset.count), index = $$("[data-count]").indexOf(el), suffix = t(content.home.metrics[index].suffix);
        const start = performance.now(), duration = 750;
        const tick = now => { const progress = Math.min(1, (now - start) / duration); el.textContent = Math.round(target * (1 - Math.pow(1 - progress, 3))) + suffix; if (progress < 1) requestAnimationFrame(tick); };
        requestAnimationFrame(tick); countObserver.unobserve(el);
      }), { threshold: .45 });
      $$("[data-count]").forEach(el => countObserver.observe(el));
      const revealObserver = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add("is-visible"); revealObserver.unobserve(entry.target); } }), { threshold: .22 });
      $$(".timeline-item, .comparison").forEach(el => revealObserver.observe(el));
    }

    function openContact() {
      lastFocused = document.activeElement; $("#contactModal").classList.add("is-open"); document.body.classList.add("modal-open"); $("#closeModal").focus();
    }
    function closeContact() {
      $("#contactModal").classList.remove("is-open"); document.body.classList.remove("modal-open"); lastFocused?.focus();
    }

    $("#languageSwitch").addEventListener("click", () => { currentLang = currentLang === "zh" ? "en" : "zh"; renderAll(); });
    $("#headerContact").addEventListener("click", openContact);
    $("#closeModal").addEventListener("click", closeContact);
    $("#contactModal").addEventListener("click", event => { if (event.target === $("#contactModal")) closeContact(); });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && $("#contactModal").classList.contains("is-open")) closeContact();
      if (activeTab === 2 && !$("#contactModal").classList.contains("is-open") && !["SUMMARY", "BUTTON", "A", "INPUT"].includes(document.activeElement.tagName)) {
        if (event.key === "ArrowLeft") changeCase(activeCase - 1, -1);
        if (event.key === "ArrowRight") changeCase(activeCase + 1, 1);
      }
      if (event.key === "Tab" && $("#contactModal").classList.contains("is-open")) {
        const focusable = $$("button, a[href]", $("#contactModal")); const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    renderAll();
  </script>
</body>
</html>
